e:"no",animal:"no",person:"yes",game:"no",job:"irrelevant",weather:"irrelevant",time:"irrelevant",object:"irrelevant",money:"irrelevant",place:"irrelevant"};function a2(a,n){return a.flags[n]??t2[n]??"irrelevant"}const Xy=[{id:"phone-tester",mechanism:"hidden-role",level:1,setup:"Every working day, Priya drops brand-new phones onto a concrete floor from carefully measured heights. Whenever one cracks, her manager thanks her.",question:"Why is her manager pleased?",solution:"Priya is a durability tester for the company that makes the phones. Breaking them on purpose, before they go on sale, shows the engineers exactly where the design is weak.",short:"She is paid to test how tough new phones are.",keyPoints:["it is her job","she is testing how tough the phones are","it happens before the phones are sold"],facts:[["Is Priya paid to do this?","yes"],["Do the phones belong to Priya?","no","They belong to her employer."],["Is Priya angry or upset?","no"],["Will these particular phones be sold afterwards?","no"],["Is this happening before the phones go on sale?","yes"],["Does the type of floor matter?","irrelevant"]],flags:{job:"yes",object:"yes",money:"irrelevant"},wrong:[["She is secretly sabotaging the company’s newest product.","Her manager thanks her — she is doing exactly what she is paid for."],["The phones are faulty returns, and she is scrapping them.","They are brand new, and the breakages are measured to learn something."],["She is clumsy, and her manager’s thanks are sarcastic.","She drops them deliberately from measured heights."]],hints:["Her employer approves of what she does.","What would a company want to know before selling a product?","Some people are paid to break things."]},{id:"queue-sitter",mechanism:"hidden-role",level:2,setup:"Every Saturday, Tomas joins long queues outside concert halls and new shops. He waits for hours, then walks away just as he reaches the front, without buying anything. He goes home delighted.",question:"What is going on?",solution:"Tomas is a professional queue-sitter. Busy clients pay him to hold their place; when he reaches the front, the client swaps in and makes the purchase.",short:"He is paid to hold queue places for clients who swap in.",keyPoints:["someone pays him","he holds a place for someone else","the other person buys when they reach the front"],facts:[["Does someone else take his place?","yes"],["Is Tomas paid for this?","yes"],["Is he trying to buy something for himself?","no"],["Does he know the person who takes his place?","yes","They are his clients."],["Is he trying to stop other people buying?","no"],["Does it matter which shop or concert it is?","irrelevant"]],flags:{job:"yes",money:"yes",person:"yes"},wrong:[["He loses his nerve at the last moment and walks away.","It happens every week and he is delighted — it is planned."],["He is a mystery shopper timing how long the queues are.","A mystery shopper would actually buy something."],["He is staging a protest against shops that make people wait.","He leaves quietly and happily without making a fuss."]],hints:["He is not the only person involved.","Long queues are good news for him.","Some busy people would rather pay than wait."]},{id:"wine-judge",mechanism:"hidden-role",level:1,setup:"At an elegant event, a woman tastes glass after glass of expensive wine and spits every single mouthful into a bucket. Nobody thinks she is rude; in fact, everyone listens carefully to what she says.",question:"Why?",solution:"She is a professional wine judge. Tasting dozens of wines without swallowing keeps her sober and her judgement sharp, so spitting is normal — and her opinion is what everyone is waiting for.",short:"She is a wine judge; spitting keeps her sober.",keyPoints:["she is judging or assessing the wines","spitting keeps her sober","it is normal in her profession"],facts:[["Is she judging the wines?","yes"],["Does she dislike the wines?","no","She spits out the ones she likes too."],["Is she trying to stay sober?","yes"],["Is spitting normal in her line of work?","yes"],["Is she unwell?","no"],["Is the bucket special?","irrelevant"]],flags:{job:"yes"},wrong:[["The wines taste terrible, and she is too polite to say so.","She spits out the wines she likes as well."],["She is not allowed to drink alcohol for health reasons.","Then she would not be tasting wine at all, and nobody would be waiting for her verdict."],["It is a prank she plays on the hosts every year.","Everyone treats it as normal and listens to her judgement."]],hints:["Her opinion matters to everyone present.","She has to taste a great many wines in one evening.","What would happen if she swallowed every mouthful?"]},{id:"bank-tester",mechanism:"hidden-role",level:3,setup:"In the middle of the night, Juno slips past the bank’s guards, picks the lock of the door to the vault room and photographs the vault. She takes nothing. The next morning the bank pays her a large fee.",question:"Why does the bank pay her?",solution:"The bank’s managers hired Juno to test their security. Her photographs prove she got in, and her report shows exactly which weaknesses to fix. The guards were not told in advance so the test would be realistic.",short:"The bank hired her to test its own security.",keyPoints:["she was hired by the bank","to test the security","the photo is proof she got in"],facts:[["Did the bank’s managers know someone would try to get in?","yes","They hired her."],["Were the guards told in advance?","no"],["Did Juno take anything?","no"],["Is the photograph important?","yes","It proves she reached the vault."],["Was Juno arrested?","no"],["Does it matter what time of night it was?","irrelevant"]],flags:{job:"yes",crime:"no",money:"yes"},wrong:[["She was a caught thief, rewarded for returning the photos.","She was paid a fee, took nothing, and was never arrested."],["She blackmailed the bank with the embarrassing photos.","Blackmail is a crime; the bank paid her an agreed fee."],["She works there as a night cleaner and took the photos.","Cleaners do not sneak past guards or pick locks."]],hints:["No crime was committed.","Someone at the bank wanted this to happen.","How else would a bank find out whether its defences work?"]},{id:"crash-test",mechanism:"hidden-role",level:1,setup:"Every week, Amal’s team sends brand-new cars racing into a concrete wall. The “passengers” never complain, and the carmaker is delighted with the wrecks.",question:"Why?",solution:"Amal runs crash tests for the carmaker. The passengers are crash-test dummies covered in sensors; the wrecks show how well the cars protect real people.",short:"They are safety crash tests using dummies.",keyPoints:["it is a safety test","the passengers are dummies","it helps make cars safer"],facts:[["Are the passengers people?","no","They are crash-test dummies."],["Is anyone hurt?","no"],["Is the goal to make cars safer?","yes"],["Are the cars faulty?","no"],["Is anything measured during the crash?","yes"],["Does the colour of the cars matter?","irrelevant"]],flags:{job:"yes",person:"no"},wrong:[["It is an elaborate insurance fraud by the car owners.","The cars are wrecked openly, for the manufacturer, and measured afterwards."],["They are filming dangerous stunts for an action movie.","Nothing is filmed for entertainment; sensors record data."],["The passengers are prisoners being punished.","There are no human passengers at all."]],hints:["Nobody is in danger.","The passengers are covered in sensors.","Carmakers must prove their cars protect people."]},{id:"snowman",mechanism:"not-a-person",level:1,setup:"When the children ran outside on the first warm morning of spring, Captain Frost was gone. On the lawn lay a hat, a scarf, a carrot and two lumps of coal in a puddle. Nobody called the police.",question:"What happened to Captain Frost?",solution:"Captain Frost was the snowman the children had built. The warm weather melted him, leaving only his hat, scarf, carrot nose and coal eyes in a puddle.",short:"Captain Frost was a snowman who melted.",keyPoints:["Captain Frost was a snowman","the warm weather melted him"],facts:[["Was Captain Frost a person?","no"],["Did the children make Captain Frost?","yes"],["Is the puddle important?","yes"],["Did someone take Captain Frost away?","no"],["Was anyone to blame?","no"],["Does the type of hat matter?","irrelevant"]],flags:{weather:"yes",time:"yes",person:"no"},wrong:[["He was kidnapped and the clues were left behind.","Nobody took him; the clues are simply what was left after he melted."],["He ran off in a hurry and dropped his things.","Captain Frost could not move at all."],["The neighbours staged his disappearance as a prank.","Nobody did anything — the sunshine did."]],hints:["Captain Frost was not a living person.","The weather had just changed.","Think about the carrot and the coal."]},{id:"robot-hoover",mechanism:"not-a-person",level:2,setup:"Every night at 2 a.m., something in Mei’s flat bumps into the furniture, hums around the rooms and then returns to the same corner. Mei sleeps peacefully through it.",question:"What is it?",solution:"It is Mei’s robot vacuum cleaner. She scheduled it to clean at night; it bumps gently into furniture as it navigates and then returns to its charging dock in the corner.",short:"It is a robot vacuum on a night-time schedule.",keyPoints:["it is a robot vacuum cleaner","it was scheduled by Mei","it returns to charge"],facts:[["Is it alive?","no"],["Did Mei arrange for this to happen?","yes"],["Does it use electricity?","yes"],["Is it a burglar?","no"],["Is it a pet?","no"],["Does it matter that it is 2 a.m.?","irrelevant","Any time would work; Mei just prefers the night."]],flags:{person:"no",object:"no",animal:"no"},wrong:[["A restless ghost wanders the flat every night.","It plugs itself into the wall to recharge."],["Her cat prowls around the rooms in the dark.","Cats do not hum or return to a charging dock."],["A burglar searches the rooms while she sleeps.","Nothing is ever taken, and it runs on a schedule Mei set."]],hints:["It is not alive.","Mei is the one who set it going.","It needs recharging."]},{id:"statue",mechanism:"not-a-person",level:2,setup:"A man has stood in the town square, perfectly still, through rain, snow and heatwaves for forty years. He has never eaten or drunk anything. Every spring, people lay flowers at his feet.",question:"How is this possible?",solution:"The “man” is a bronze statue of a local hero. Each spring, on the anniversary of what he did, people leave flowers in his memory.",short:"He is a statue; the flowers mark an anniversary.",keyPoints:["he is a statue","the flowers honour the person he represents"],facts:[["Is he alive?","no"],["Is he made of metal or stone?","yes"],["Does he represent a real person?","yes","A local hero."],["Do the flowers mark an anniversary?","yes"],["Is he a street performer?","no"],["Does the weather affect him?","irrelevant"]],flags:{person:"no",time:"yes"},wrong:[["He is a living-statue street performer.","No performer could stand still for forty years without eating."],["He is a protester on a very long hunger strike.","Nobody survives forty years without food."],["He is a ghost that only some people can see.","He is solid and people touch him."]],hints:["He is not alive.","He represents someone admired by the town.","What is often put up in a town square?"]},{id:"human-cannonball",mechanism:"double-meaning",level:2,setup:"On Monday, Teo was fired three times by his employer. Each time a crowd cheered, and at the end of the day he went home with a bonus.",question:"Why was he celebrating?",solution:"Teo is a circus “human cannonball”. Being fired means being shot out of a cannon into a net — the crowd cheered each launch, and three shows earned him a bonus.",short:"He is a human cannonball, fired from a circus cannon.",keyPoints:["“fired” means shot from a cannon","he is a circus performer"],facts:[["Did Teo lose his job?","no"],["Is Teo a performer?","yes"],["Is there a cannon involved?","yes"],["Was he in danger?","irrelevant","There is a net — it is a stunt."],["Was he in an office?","no"]],flags:{job:"yes",game:"yes",harm:"no"},wrong:[["He kept losing his job and being hired back again.","He never lost his job — the crowd was cheering."],["He works in a pottery, where the pots are fired.","Pots are fired, not people, and crowds do not cheer kilns."],["His boss was only joking about firing him.","He really was fired — from a cannon, three times."]],hints:["“Fired” does not mean what you first think.","A crowd was watching.","Think of the circus."]},{id:"photographer",mechanism:"double-meaning",level:3,setup:"Lena shot her husband, held him under water for a few minutes, and then hung him up. That evening they went out to dinner together.",question:"How?",solution:"Lena is a photographer using film. She shot (photographed) her husband, developed the photo in a bath of liquid, and hung the print up to dry.",short:"She took his photo, developed it and hung it.",keyPoints:["“shot” means photographed","the photo was developed in liquid","the print was hung up to dry"],facts:[["Was her husband hurt?","no"],["Is “shot” meant literally?","no"],["Was a camera involved?","yes"],["Is this a digital camera?","no","It is old-fashioned film photography."],["Was the husband physically under water?","no"]],flags:{job:"irrelevant",object:"yes",harm:"no"},wrong:[["It was an elaborate magic trick performed on stage.","No trick is needed: every verb has a second meaning."],["Her “husband” is a shop-window dummy.","He went to dinner with her."],["It was all a strange dream she had.","It all really happened."]],hints:["Nobody was hurt.","Every verb has a second meaning.","Think of an old-fashioned darkroom."]},{id:"drew-a-bath",mechanism:"double-meaning",level:1,setup:"Mila drew a bath for her little brother, but neither of them got wet and no water was used.",question:"How?",solution:"Mila drew a picture of a bath — with a pencil — for her brother.",short:"She drew a picture of a bath.",keyPoints:["“drew” means made a drawing"],facts:[["Was water involved?","no"],["Did Mila use a pencil or crayons?","yes"],["Is the bath real?","no"],["Was the bathroom broken?","no"]],flags:{object:"no"},wrong:[["The plug was missing, so the bath leaked.","There was never any water."],["She forgot to turn on the tap.","She never meant to fill a bath."],["It was too cold to bathe.","Nobody planned to bathe."]],hints:["No water was ever planned.","“Drew” has more than one meaning.","Her brother might pin it on the fridge."]},{id:"summer-christmas",mechanism:"time-and-place",level:2,setup:"Every year, Oliver celebrates his December birthday with a barbecue on the beach, sweating in the heat. He has never left his home country.",question:"How can December be so hot?",solution:"Oliver lives in the Southern Hemisphere — for example in Australia — where December is the middle of summer.",short:"He lives in the Southern Hemisphere.",keyPoints:["he lives in the Southern Hemisphere","December is summer there"],facts:[["Does he live in Europe?","no"],["Is it summer in December where he lives?","yes"],["Is it an unusual heatwave?","no","It is hot every December."],["Is the beach indoors?","no"],["Has he moved his birthday?","no"]],flags:{place:"yes",time:"yes",weather:"yes"},wrong:[["He goes to a heated indoor beach every December.","The beach is outdoors and it is hot every December."],["He celebrates his birthday at the beach in summer instead.","He celebrates in December."],["There happens to be a freak heatwave this December.","It happens every single year."]],hints:["Where he lives matters more than when.","Seasons are not the same everywhere on Earth.","Think of the other side of the equator."]},{id:"two-new-years",mechanism:"time-and-place",level:3,setup:"At midnight on 31 December, Nadia cheered in the New Year. A little later, after a short flight, she cheered in the New Year at midnight again — in a different country, on the same night.",question:"How?",solution:"She flew west into a time zone where the clocks were several hours behind. Her flight was shorter than the time difference, so she landed before midnight local time and celebrated again.",short:"She flew west, into a time zone hours behind.",keyPoints:["she crossed into an earlier time zone","the flight was shorter than the time difference"],facts:[["Did Nadia travel?","yes"],["Did she fly west?","yes"],["Are time zones important?","yes"],["Was either celebration a recording?","no"],["Did one country use a different calendar?","no"]],flags:{place:"yes",time:"yes"},wrong:[["She watched a recording of the first fireworks later.","She was really there at midnight both times."],["The second country celebrates New Year on another date.","Both celebrated at midnight on 31 December, local time."],["Her watch was wrong, so she celebrated too early.","Both midnights were real local midnights."]],hints:["She really did travel between the two celebrations.","Midnight does not happen everywhere at once.","Which direction should she fly to gain time?"]},{id:"window-cleaner",mechanism:"perspective",level:2,setup:"A window cleaner at a forty-storey office tower slipped and fell from his ladder. He was not hurt at all.",question:"How did he escape injury?",solution:"He was cleaning a ground-floor window, so he fell less than a metre.",short:"He was cleaning a ground-floor window at the time.",keyPoints:["he was close to the ground","the height of the building is irrelevant"],facts:[["Was he high up when he fell?","no"],["Was there a safety net?","no"],["Does the height of the building matter?","no"],["Was he wearing a harness?","no","He did not need one."],["Did he land on something soft?","irrelevant"]],flags:{job:"yes",place:"yes"},wrong:[["He was wearing a safety harness that caught him in time.","No harness or rope was involved."],["He landed on the soft roof of a parked car.","He fell less than a metre."],["It was a carefully rehearsed film stunt.","He really was cleaning windows."]],hints:["The size of the building is a distraction.","Which window was he cleaning?","Not every window of a tall building is high up."]},{id:"vr-summit",mechanism:"perspective",level:2,setup:"Sana stood on the summit of a famous mountain, high above the clouds. A moment later she took two steps and made a cup of tea in her kitchen.",question:"How?",solution:"She was wearing a virtual-reality headset at home, exploring a 3D recreation of the mountain. Taking the headset off, she walked into her kitchen.",short:"She was there only in virtual reality.",keyPoints:["virtual reality","she never left home"],facts:[["Was she wearing something on her head?","yes"],["Did she travel anywhere?","no"],["Is the mountain real?","yes","But she visited a digital copy of it."],["Was she dreaming?","no"],["Does she live on a mountain?","no"]],flags:{object:"irrelevant",place:"yes"},wrong:[["She lives in a cabin at the top of the mountain.","Her kitchen is in an ordinary city flat."],["It was a vivid dream she had while napping.","She was wide awake."],["She was looking at a huge painting of the summit.","She could look all around her as if she were standing there."]],hints:["She never left her home.","She was wearing something special.","Think of modern technology for games and tours."]},{id:"bottle-fire",mechanism:"object-use",level:2,setup:"Stranded in the hills with no matches, no lighter and a dead phone, Ines lit a campfire at midday using only her clear plastic water bottle.",question:"How?",solution:"A clear bottle full of water acts as a lens. Ines focused the midday sunlight through it onto dry grass until the grass began to smoulder.",short:"She used the water-filled bottle as a lens.",keyPoints:["the bottle full of water acts as a lens","it focuses sunlight","onto dry tinder"],facts:[["Was the bottle full of water?","yes"],["Does the sun matter?","yes"],["Could she have done this at night?","no"],["Did she rub anything together?","no"],["Did the water itself burn?","no"]],flags:{weather:"yes",object:"yes",time:"yes"},wrong:[["She rubbed the bottle hard against a dry stick.","No friction was involved."],["The bottle secretly held fuel instead of water.","It held ordinary water."],["The bottle got hot in the sun and lit the grass.","Warm plastic is not hot enough; focused light is."]],hints:["It only works on a sunny day.","The water inside matters.","Think of a magnifying glass."]},{id:"cd-tree",mechanism:"object-use",level:1,setup:"Every summer, Rui hangs old music CDs from the branches of his cherry tree, although he never plays music in the garden.",question:"Why?",solution:"The spinning CDs flash in the sunlight and scare birds away, protecting his cherries.",short:"The shiny CDs scare birds off his cherries.",keyPoints:["to scare birds","to protect the fruit"],facts:[["Are birds involved?","yes"],["Is it mainly for decoration?","no"],["Does the shine matter?","yes"],["Does he want to protect the fruit?","yes"],["Does the music on the CDs matter?","no"]],flags:{animal:"yes",object:"yes",time:"yes"},wrong:[["He is recycling his old CDs as garden decorations.","He takes them down after the harvest and reuses them next year."],["He is decorating the garden for a party.","It happens all summer, every year, only on the fruit tree."],["He is marking the tree to be cut down.","He wants the tree’s cherries."]],hints:["Someone else wants his cherries.","The CDs spin and flash.","Birds hate sudden flashes."]},{id:"surgeon",mechanism:"assumption",level:1,setup:"A boy and his father are rushed to hospital after a cycling accident. The surgeon on duty looks at the boy and says, “I can’t operate — this is my son.” The surgeon is telling the truth.",question:"How?",solution:"The surgeon is the boy’s mother. (Any other parent works too — the puzzle tests the assumption that a surgeon must be a man.)",short:"The surgeon is the boy’s mother.",keyPoints:["the surgeon is the boy’s other parent (his mother)"],facts:[["Is the surgeo board or typewriter fits equally well.",hints:["“Keys” has more than one meaning.","You press these keys rather than turn them.","They might be black and white."],wrong:[["A locksmith","A locksmith opens locks."],["A door","A door has a lock, not keys."],["A car","Car keys do open the car’s locks."]]},{id:"silence",kind:"wordplay",level:1,text:"What breaks as soon as you say its name?",answer:"silence",accepted:["silence","quiet","the silence"],explanation:"Saying anything at all — including “silence” — ends the silence.",hints:["It is not an object.","It disappears when there is any sound.","Libraries ask you to keep it."],wrong:[["A promise","Saying “promise” does not break a promise."],["Glass","Saying “glass” does not break it."],["A secret","Saying the word “secret” does not reveal the secret."]]},{id:"candle",kind:"what-am-i",level:1,text:"I am tall when I am young and short when I am old. What am I?",answer:"a candle",accepted:["candle","a candle","pencil","crayon","chalk"],alternatives:["a pencil (it gets shorter as it is used)"],explanation:"A candle starts tall and burns down shorter over its life. A pencil also fits: it gets shorter as it is sharpened and used.",hints:["It gets used up.","Its “age” is how much it has been used.","It gives light while it shrinks."],wrong:[["A tree","Trees grow taller as they age."],["A person","People grow taller as they get older (at first)."],["A shadow","A shadow’s length depends on the time of day, not its age."]]},{id:"needle",kind:"what-am-i",level:1,text:"I have one eye but I cannot see. What am I?",answer:"a needle",accepted:["needle","a needle","sewing needle","storm","hurricane"],alternatives:["a hurricane (it has an “eye”)"],explanation:"A sewing needle has an “eye” — the hole the thread goes through — but cannot see. A storm or hurricane also has an “eye”.",hints:["“Eye” is meant in a non-human sense.","It is used with thread.","The eye is a tiny hole."],wrong:[["A cyclops","A cyclops has one eye and can see wi ing at the silent-auction table.",statements:[{id:"hugo-1",question:"Did you know your painting was fake?",answer:"Fake? This is the first I have heard of it.",claim:{t:"topic",topic:"hugo-knew-fake"}},{id:"hugo-2",question:"Where were you during the speeches?",answer:"At the auction table, guarding my bids on the sculpture until bidding closed at quarter past.",claim:{t:"whereabouts",who:"hugo",from:"20:50",to:"21:15",where:"auction table"}}]},{id:"margot",name:"Margot Fenn",role:"Art critic",portrait:{hue:260,skin:2,hair:"long",hairColor:2,accessory:"scarf"},bio:"Influential critic with a sharp pen and, it turns out, a borrowed one.",relationship:"Victor was blackmailing her over a plagiarised review.",motive:"Victor was blackmailing her and had just raised his price.",alibi:"Says she spent part of the evening in the cloakroom and restroom, nursing a headache.",statements:[{id:"margot-1",question:"Did you speak to Victor tonight?",answer:"I didn’t exchange a word with him.",claim:{t:"topic",topic:"margot-argued"}},{id:"margot-2",question:"Where were you around nine?",answer:"Downstairs, mostly in the restroom. I don’t have a witness, if that’s what you’re asking."},{id:"margot-3",question:"Could you get into the office?",answer:"I don’t know any door codes. I’ve never been up there without Victor letting me in."}]},{id:"jasper",name:"Jasper Quill",role:"Gallery assistant",portrait:{hue:170,skin:4,hair:"short",hairColor:0,accessory:"none"},bio:"Young, anxious and very organised. Ran the guest list all night.",relationship:"Employee; Victor had told him he would be let go after the gala.",motive:"He was about to lose his job.",alibi:"Checking guests in at the front desk until he went up to fetch Victor for the auction results.",statements:[{id:"jasper-1",question:"Where were you between nine and twenty past?",answer:"At the front desk with the check-in tablet. At twenty-five past I went up to fetch Victor for the results.",claim:{t:"whereabouts",who:"jasper",from:"2
