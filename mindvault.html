 The attendant says Hugo stood at the table from about 20:50 until bidding closed at 21:15.",facts:[{t:"elsewhere",who:"hugo",from:"20:50",to:"21:15",where:"auction table"}]},{id:"desk",title:"Check-in tablet log",kind:"record",location:"Front desk",summary:"Guest arrivals.",details:"Check-ins under Jasper’s login every few minutes from 20:50 to 21:24; three late guests remember him greeting them.",facts:[{t:"elsewhere",who:"jasper",from:"20:50",to:"21:24",where:"front desk"}]},{id:"coatcheck",title:"Coat-check ledger",kind:"document",location:"Cloakroom",summary:"When coats were collected.",details:"Ticket 47 (N. Rourke, black cashmere coat) collected at 21:28.",facts:[{t:"seen",who:"nadia",from:"21:28",to:"21:28",where:"gallery cloakroom"}]},{id:"taxi",title:"Taxi company dispatch record",kind:"record",location:"City Cabs",summary:"Nadia’s ride home.",details:"Booked by phone at 21:20; pickup at the gallery entrance at 21:31. The driver remembers a woman in a black cashmere coat, “out of breath”.",facts:[{t:"seen",who:"nadia",from:"21:31",to:"21:31",where:"gallery entrance"}]},{id:"caterer",title:"Caterer’s statement",kind:"testimony",location:"Ballroom bar",summary:"Who spoke to Victor.",details:"At 20:40 the caterer saw Margot Fenn arguing with Victor near the bar (“You can’t keep doing this to me”). At 20:55 he saw Victor go up to his office alone.",facts:[{t:"record",topic:"margot-argued"}]},{id:"email",title:"Hugo’s email to his lawyer",kind:"document",location:"Hugo’s phone",summary:"Sent at 18:00.",details:"“The landscape is a fake and Lindell knew it. Prepare the papers — I’ll confront him tonight.”",facts:[{t:"record",topic:"hugo-knew-fake"}]},{id:"audit",title:"Draft audit memo",kind:"document",location:"Victor’s desk",summary:"Found under the body.",details:"“N. Rourke — £340,000 unaccounted for. Partnership to be dissolved Monday; police to be informed.”",facts:[]}],timeline:[{id:"t1",time:"18:00",text:"Hugo emails his lawyer about the forgery.",sources:["email"],kind:"established"},{id:"t2",time:"20:40",text:"Margot argues with Victor at the bar.",sources:["caterer"],kind:"established"},{id:"t3",time:"20:45",text:"Nadia says she left the gala.",sources:["nadia-1"],kind:"claimed"},{id:"t4",time:"20:50",text:"Clara begins her speech; Hugo is at the auction table; Jasper is checking guests in.",sources:["video","auction","desk"],kind:"established"},{id:"t5",time:"20:55",text:"Victor enters his office with his code.",sources:["doorlog","caterer"],kind:"established"},{id:"t6",time:"20:58",text:"The office door is opened with Nadia’s code.",sources:["doorlog"],kind:"established"},{id:"t7",time:"21:04",text:"Someone leaves the office.",sources:["doorlog"],kind:"established"},{id:"t8",time:"21:15",text:"Latest time of death; silent bidding closes.",sources:["coroner","auction"],kind:"established"},{id:"t9",time:"21:20",text:"A taxi is booked for Nadia.",sources:["taxi"],kind:"established"},{id:"t10",time:"21:25",text:"Jasper opens the office and finds Victor.",sources:["doorlog","jasper-1"],kind:"established"},{id:"t11",time:"21:28",text:"Nadia’s coat is collected from the cloakroom.",sources:["coatcheck"],kind:"established"},{id:"t12",time:"21:31",text:"Nadia’s taxi picks her up at the entrance.",sources:["taxi"],kind:"established"}],contradictions:[{id:"c-nadia-door",statementId:"nadia-1",evidenceId:"doorlog",explanation:"Nadia claims she left at 20:45, but her personal code opened Victor’s office at 20:58.",exposes:"nadia",redHerring:!1},{id:"c-nadia-taxi",statementId:"nadia-1",evidenceId:"taxi",explanation:"Her taxi did not collect her until 21:31 — long after she says she left.",exposes:"nadia",redHerring:!1},{id:"c-nadia-coat",statementId:"nadia-1",evidenceId:"coatcheck",explanation:"Her coat was still in the cloakroom until 21:28.",exposes:"nadia",redHerring:!1},{id:"c-margot",statementId:"margot-1",evidenceId:"caterer",explanation:"Margot denies speaking to Victor, but the caterer saw them argue at 20:40 — she was hiding the blackmail, not a murder.",exposes:"margot",redHerring:!0},{id:"c-hugo",statementId:"hugo-1",evidenceId:"email",explanation:"Hugo knew about the forgery hours earlier; he planned a confrontation and a lawsuit, but he never left the auction table.",exposes:"hugo",redHerring:!0}],methods:[{id:"opener",text:"Stabbed with his own letter opener"},{id:"cord",text:"Strangled with a curtain cord"},{id:"champagne",text:"Poisoned champagne"},{id:"bust",text:"Struck with a bronze bust"}],truth:{culprit:"nadia",method:"opener",motive:"Victor’s audit was about to expose £340,000 she had taken.",keyEvidence:["doorlog","taxi","coatcheck"],narrative:[{time:"20:45",text:"Nadia announces her migraine and makes a show of leaving."},{time:"20:55",text:"Victor goes up to his office with the audit memo."},{time:"20:58",text:"Nadia lets herself in with her own code; they argue over the audit."},{time:"21:02",text:"She stabs Victor with the letter opener and wipes it."},{time:"21:04",text:"She leaves the office and hides in the empty cloakroom corridor."},{time:"21:20",text:"She books a taxi, collects her coat at 21:28 and leaves at 21:31."}]},solution:{summary:"Nadia Rourke never left at 20:45. Her own code opened the office at 20:58, the only entry after Victor’s, and the coat check and taxi prove she was still in the building until 21:31.",decisive:[{evidenceId:"doorlog",why:"Only Nadia’s code opened the door between Victor’s entry and the discovery of his body."},{evidenceId:"taxi",why:"Her taxi picked her up at 21:31, destroying her alibi."},{evidenceId:"audit",why:"The audit memo gave her an urgent motive."}],eliminations:[{suspectId:"clara",reason:"On stage until 21:10 and photographed with the mayor until 21:20.",evidence:["video","photos"]},{suspectId:"hugo",reason:"At the auction table from 20:50 until bidding closed at 21:15.",evidence:["auction"]},{suspectId:"margot",reason:"She has no code and no one but Nadia’s code entered after Victor.",evidence:["doorlog"]},{suspectId:"jasper",reason:"Checking guests in at the front desk until 21:24.",evidence:["desk"]}],redHerrings:[{ref:"caterer",explanation:"Margot’s argument was about blackmail; she could not get into the office."},{ref:"email",explanation:"Hugo meant to confront Victor and sue, but he never left the auction table."},{ref:"clara-2",explanation:"Clara’s royalty grievance is real, but she was on stage and in photographs throughout."}]}},N$=["lionel","owen","priya","bernard","gideon"].map(a=>({t:"means",who:a,value:!0,note:"anyone could hold a person under in the lily pond"})),A$={id:"glasshouse",title:"The Victoria House",subtitle:"A tropical glasshouse, a borrowed badge and a thermometer that noticed every door.",setting:"The Victoria House, the giant-water-lily glasshouse at Ashcombe Botanic Garden",difficulty:4,structure:"Borrowed credentials: badge logs, a climate sensor, number-plate cameras — and who was really holding badge #12?",crossesMidnight:!1,synopsis:"Head gardener Ruth Calder was found face down in the great lily pond of the Victoria House at dawn. The glasshouse opens only with a staff badge, and the log shows exactly one visitor after Ruth: badge #12. Its owner has an excellent alibi. So who was carrying it?",victim:{name:"Ruth Calder (49)",description:"Head gardener for twenty years, devoted to the rare plant collection and allergic to cutting corners.",found:"Found drowned in the lily pond at 07:00 by the morning keeper."},scene:"The Victoria House can only be entered with a staff badge; leaving needs no badge. A climate computer records temperature every minute, and every door opening causes a sharp dip. The staff car park barrier has a number-plate camera.",suspects:[{id:"lionel",name:"Dr Lionel Sharpe",role:"Garden director",portrait:{hue:160,skin:0,hair:"swept",hairColor:1,accessory:"glasses"},bio:"Polished fundraiser who rescued the garden’s finances. Rumoured to have very expensive tastes.",relationship:"Ruth’s manager.",motive:"Ruth had discovered that rare seeds were vanishing from the vault and traced them to him.",alibi:"Says he went home at 18:00 and spent the evening there alone.",statements:[{id:"lionel-1",question:"Where were you this evening?",answer:"I left at six and was at home all night. I live alone, so no one can vouch for me, but I didn’t come back.",claim:{t:"whereabouts",who:"lionel",from:"18:00",to:"23:59",where:"home"}},{id:"lionel-2",question:"You borrowed Owen’s badge today?",answer:"Mine was being reprogrammed. I borrowed his at two and put it back in his locker at five, before I left.",claim:{t:"topic",topic:"badge-returned"}},{id:"lionel-3",question:"Did Ruth raise any concerns with you?",answer:"About the seed inventory? A clerical muddle. I told her I’d look into it."}]},{id:"owen",name:"Owen Hardy",role:"Volunteer, holder of badge #12",portrait:{hue:90,skin:2,hair:"curly",hairColor:2,accessory:"none"},bio:"Retired teacher who volunteers three days a week and sings bass in the town choir.",relationship:"Volunteer under Ruth; she once reported him for propagating cuttings without permission.",motive:"Ruth had threatened to end his volunteering after the cuttings incident.",alibi:"At choir rehearsal from 21:30 until 23:00.",statements:[{id:"owen-1",question:"Where is your badge?",answer:"I lent it to Dr Sharpe at two o’clock because his wasn’t working. He never gave it back, and it wasn’t in my locker this morning."},{id:"owen-2",question:"Where were you tonight?",answer:"Choir practice at St Mary’s, half nine until eleven. We were recording for the Christmas concert.",claim:{t:"whereabouts",who:"owen",from:"21:30",to:"23:00",where:"St Mary’s church"}}]},{id:"priya",name:"Dr Priya Nair",role:"Senior botanist",portrait:{hue:30,skin:3,hair:"long",hairColor:0,accessory:"earrings"},bio:"Brilliant orchid specialist; passed over for the head gardener post in Ruth’s favour.",relationship:"Colleague and rival.",motive:"Ruth blocked her promotion twice.",alibi:"Collecting her mother from the airport.",statements:[{id:"priya-1",question:"Have you been in the seed vault recently?",answer:"Never. That’s Ruth’s domain.",claim:{t:"topic",topic:"priya-vault"}},{id:"priya-2",question:"Where were you tonight?",answer:"At the airport from nine; my mother’s flight was late. We got home after midnight.",claim:{t:"whereabouts",who:"priya",from:"21:00",to:"23:30",where:"airport"}}]},{id:"bernard",name:"Bernard Kowalski",role:"Night security guard",portrait:{hue:240,skin:1,hair:"bald",hairColor:1,accessory:"hat"},bio:"Patrols the 80-acre estate every night with a checkpoint scanner and a master key.",relationship:"Ruth had complained to the director that he slept on duty.",motive:"He was on a final warning because of her complaint.",alibi:"On his patrol route on the far side of the estate.",statements:[{id:"bernard-1",question:"Where were you between nine and midnight?",answer:"Walking the east loop, scanning every checkpoint. The scanner will tell you.",claim:{t:"whereabouts",who:"bernard",from:"21:30",to:"23:45",where:"east loop"}},{id:"bernard-2",question:"Do you ever sleep on shift?",answer:"Never. That woman made it up.",claim:{t:"topic",topic:"bernard-sleeps"}}]},{id:"gideon",name:"Gideon Ash",role:"Landscape contractor, Ruth’s ex-husband",portrait:{hue:0,skin:4,hair:"short",hairColor:0,accessory:"beard"},bio:"Runs a landscaping firm; bitter custody dispute with Ruth over their teenage son.",relationship:"Ex-husband.",motive:"A court hearing next week was expected to go Ruth’s way.",alibi:"At a pub quiz in the next village.",statements:[{id:"gideon-1",question:"When did you last see Ruth?",answer:"Months ago. We only talk through solicitors.",claim:{t:"topic",topic:"gideon-visit"}},{id:"gideon-2",question:"Where were you tonight?",answer:"Quiz night at the Plough from half eight until eleven. My team came second.",claim:{t:"whereabouts",who:"gideon",from:"20:30",to:"23:00",where:"Plough inn"}}]}],evidence:[{id:"text",title:"Ruth’s last text message",kind:"record",location:"Ruth’s phone",summary:"To her sister.",details:"21:50: “Still here — the orchids need misting and I need to think. Something is very wrong with the seed vault.”",facts:[]},{id:"coroner",title:"Post-mortem report",kind:"forensic",location:"County mortuary",summary:"Cause and time of death.",details:"Death by drowning. Bruising on both shoulders shows she was held under. Death between 21:50 and 23:00.",facts:[{t:"window",from:"21:50",to:"23:00"}]},{id:"pond",title:"The lily pond",kind:"physical",location:"Centre of the Victoria House",summary:"Waist-deep warm water.",details:"Scuffed edging stones and a broken lily pad near where she was found. No weapon was needed.",facts:N$},{id:"badgelog",title:"Victoria House badge log",kind:"record",location:"Access server",summary:"Every badge entry.",details:"21:10 badge #3 (R. Calder). 22:05 badge #12 (assigned to O. Hardy). No other entries. Exits do not require a badge. So badge #12 was not back in Owen’s locker that evening.",facts:[{t:"record",topic:"badge-returned"}]},{id:"climate",title:"Climate computer log",kind:"record",location:"Plant room",summary:"Temperature dips.",details:"Sharp dips at 21:12, 21:42, 22:06 and 22:28. Door dips last about a minute; the 21:42 dip lasted six minutes.",facts:[]},{id:"maintenance",title:"Roof-vent maintenance log",kind:"document",location:"Plant room",summary:"Automatic vent cycle.",details:"The roof vents were set to cycle automatically at 21:42 for six minutes to test a new motor.",facts:[]},{id:"itticket",title:"IT ticket: badge reprogramming",kind:"document",location:"Facilities office",summary:"Why Lionel borrowed a badge.",details:"Dr Sharpe’s badge was disabled from 13:00 until 09:00 the next morning for reprogramming. A note says he would “borrow a volunteer badge meanwhile”.",facts:[]},{id:"choir",title:"Choir register and recording",kind:"record",location:"St Mary’s church",summary:"Owen’s alibi.",details:"Owen signed in at 21:25. The rehearsal recording runs 21:30–23:00 and his bass solo is audible at 22:10 and 22:40. The church is a 25-minute drive away.",facts:[{t:"elsewhere",who:"owen",from:"21:30",to:"23:00",where:"St Mary’s church"}]},{id:"anpr",title:"Car-park number-plate camera",kind:"record",location:"Staff car park barrier",summary:"Vehicles after hours.",details:"Dr Sharpe’s car entered the staff car park at 21:55 and left at 22:31. No other vehicles after 19:00.",facts:[{t:"seen",who:"lionel",from:"21:55",to:"22:31",where:"garden car park"}]},{id:"airport",title:"Airport parking ticket",kind:"document",location:"Priya’s car",summary:"Priya’s evening.",details:"Entered the short-stay car park at 20:58, exited at 23:41. Her mother’s flight landed at 22:15 and an arrivals-hall camera shows Priya waiting from 21:10.",facts:[{t:"elsewhere",who:"priya",from:"21:00",to:"23:30",where:"airport"}]},{id:"patrol",title:"Patrol scanner log",kind:"record",location:"Security office",summary:"Bernard’s checkpoint scans.",details:"Checkpoints on the east loop scanned at intervals of at most 15 minutes from 21:30 to 23:45. The Victoria House is a 12-minute walk from the nearest east-loop checkpoint, so a round trip plus a struggle could not fit between scans.",facts:[{t:"elsewhere",who:"bernard",from:"21:30",to:"23:45",where:"east loop"}]},{id:"quiz",title:"Pub quiz answer sheets",kind:"document",location:"The Plough inn",summary:"Gideon’s alibi.",details:"Gideon’s handwriting on every round’s answer sheet, collected at 21:00, 21:30, 22:00, 22:30 and 23:00. The quizmaster confirms he never left the table for long.",facts:[{t:"elsewhere",who:"gideon",from:"20:30",to:"23:00",where:"Plough inn"}]},{id:"notebook",title:"Ruth’s notebook",kind:"document",location:"Potting bench",summary:"Her last entries.",details:"“Vault count short again — 40 packets of rare seed. Only L.S. signed the vault out this month. Confront him.”",facts:[]},{id:"bin",title:"Badge #12 in a waste bin",kind:"physical",location:"Director’s office",summary:"Found next morning.",details:"Owen’s badge #12, found in the waste bin under the director’s desk, with a partial fingerprint matching Dr Sharpe.",facts:[]},{id:"vaultlog",title:"Seed-vault sign-out sheet",kind:"document",location:"Seed vault",summary:"Who took seeds out.",details:"Dr Nair signed out orchid seed at 14:00 for a legitimate germination trial. Dr Sharpe signed out rare seed eleven times this month with no matching trial records.",facts:[{t:"record",topic:"priya-vault"}]},{id:"complaint",title:"Ruth’s complaint about security",kind:"document",location:"HR file",summary:"Sleeping on duty.",details:"Ruth photographed Bernard asleep in the guard hut last month. He received a final warning.",facts:[{t:"record",topic:"bernard-sleeps"}]},{id:"visitors",title:"Garden office visitor book",kind:"document",location:"Garden office",summary:"An afternoon visit.",details:"G. Ash signed in at 16:00 “to drop off papers for R. Calder”. The custody papers were found on her desk.",facts:[{t:"record",topic:"gideon-visit"}]}],timeline:[{id:"t1",time:"13:00",text:"Lionel’s badge is disabled for reprogramming.",sources:["itticket"],kind:"established"},{id:"t2",time:"14:00",text:"Owen lends badge #12 to Lionel; Priya signs out orchid seed.",sources:["owen-1","vaultlog"],kind:"established"},{id:"t3",time:"16:00",text:"Gideon drops custody papers at the garden office.",sources:["visitors"],kind:"established"},{id:"t4",time:"17:00",text:"Lionel says he returned the badge to Owen’s locker.",sources:["lionel-2"],kind:"claimed"},{id:"t5",time:"18:00",text:"Lionel says he went home.",sources:["lionel-1"],kind:"claimed"},{id:"t6",time:"21:10",text:"Ruth enters the Victoria House with her badge.",sources:["badgelog","climate"],kind:"established"},{id:"t7",time:"21:42",text:"The roof vents cycle automatically for six minutes.",sources:["maintenance","climate"],kind:"established"},{id:"t8",time:"21:50",text:"Ruth texts her sister — last sign of life.",sources:["text"],kind:"established"},{id:"t9",time:"21:55",text:"Lionel’s car enters the staff car park.",sources:["anpr"],kind:"established"},{id:"t10",time:"22:05",text:"Badge #12 opens the Victoria House.",sources:["badgelog","climate"],kind:"established"},{id:"t11",time:"22:28",text:"The door opens from inside.",sources:["climate"],kind:"established"},{id:"t12",time:"22:31",text:"Lionel’s car leaves the car park.",sources:["anpr"],kind:"established"},{id:"t13",time:"23:00",text:"Latest time of death.",sources:["coroner"],kind:"established"}],contradictions:[{id:"c-lionel-anpr",statementId:"lionel-1",evidenceId:"anpr",explanation:"Lionel says he was home all evening, but his car entered the staff car park at 21:55 and left at 22:31.",exposes:"lionel",redHerring:!1},{id:"c-lionel-badge",statementId:"lionel-2",evidenceId:"badgelog",explanation:"Lionel claims he returned badge #12 at 17:00, yet it opened the glasshouse at 22:05 while Owen was singing at choir.",exposes:"lionel",redHerring:!1},{id:"c-priya",statementId:"priya-1",evidenceId:"vaultlog",explanation:"Priya did visit the vault — for an approved trial — and the same sheet exposes Lionel’s unexplained withdrawals.",exposes:"priya",redHerring:!0},{id:"c-bernard",statementId:"bernard-2",evidenceId:"complaint",explanation:"Bernard was caught sleeping on duty, which explains his grudge, but his patrol scans account for the whole evening.",exposes:"bernard",redHerring:!0},{id:"c-gideon",statementId:"gideon-1",evidenceId:"visitors",explanation:"Gideon visited that afternoon to deliver custody papers; he was at the quiz all evening.",exposes:"gideon",redHerring:!0}],methods:[{id:"drowned",text:"Held under the water of the lily pond"},{id:"fertiliser",text:"Poisoned with concentrated orchid fertiliser"},{id:"hook",text:"Struck with a pruning hook"},{id:"heat",text:"Collapsed from heat in the glasshouse"}],truth:{culprit:"lionel",method:"drowned",motive:"Ruth had traced the stolen rare seeds — sold privately for a fortune — to him.",keyEvidence:["anpr","badgelog"],narrative:[{time:"14:00",text:"Lionel borrows Owen’s badge and keeps it."},{time:"21:50",text:"Ruth texts her sister about the seed vault."},{time:"21:55",text:"Lionel drives back to the garden."},{time:"22:05",text:"He enters the Victoria House with Owen’s badge #12."},{time:"22:15",text:"Ruth confronts him; he forces her into the lily pond and holds her under."},{time:"22:28",text:"He leaves the glasshouse and drives away at 22:31, later dropping the badge in his own bin."}]},solution:{summary:"Badge #12 belonged to Owen, but Owen was singing in church while it opened the glasshouse. The badge was in Lionel’s hands, and his car sat in the staff car park exactly around the badge entry — despite his claim to have been home all night.",decisive:[{evidenceId:"anpr",why:"Lionel’s car was at the garden from 21:55 to 22:31, during the window."},{evidenceId:"badgelog",why:"Badge #12 — the badge Lionel borrowed and never returned — opened the glasshouse at 22:05."},{evidenceId:"bin",why:"The badge turned up in Lionel’s own bin with his fingerprint."}],eliminations:[{suspectId:"owen",reason:"His voice is on the choir recording at 22:10 and 22:40, 25 minutes’ drive away.",evidence:["choir"]},{suspectId:"priya",reason:"Airport parking and arrivals-hall camera cover the whole window.",evidence:["airport"]},{suspectId:"bernard",reason:"His scanner log leaves no gap long enough to reach the glasshouse and return.",evidence:["patrol"]},{suspectId:"gideon",reason:"His handwriting is on every quiz round until 23:00.",evidence:["quiz"]}],redHerrings:[{ref:"climate",explanation:"The 21:42 dip looks like a door, but it lasted six minutes — the automatic roof vents, not a visitor."},{ref:"vaultlog",explanation:"Priya’s vault visit was a legitimate trial; the same sheet points at Lionel."},{ref:"complaint",explanation:"Bernard had a grudge, but his patrol log accounts for him."},{ref:"visitors",explanation:"Gideon’s afternoon visit was about custody papers; he was at the quiz all evening."}]}},E$={id:"lighthouse",title:"The Keeper of Gull Rock",subtitle:"A tidal island, a rising sea and a weather report that was never finished.",setting:"Gull Rock lighthouse museum, a tidal island off the fishing village of Porthcarrow",difficulty:1,structure:"Tides and timetables: who could have been on the island when the causeway was underwater?",crossesMidnight:!1,synopsis:"Edmund Price, the retired keeper who now runs the lighthouse as a museum, was found dead at the foot of the lantern-room stairs. Gull Rock is joined to Porthcarrow by a stone causeway that floods at high tide. Four people had reason to want him gone. Work out who was really on the rock when he died.",victim:{name:"Edmund Price (61)",description:"Former lighthouse keeper and curator of the Gull Rock museum. Stubborn, meticulous, and still radioing a weather report to the coastguard every evening.",found:"Found at 23:30 by the relief keeper, at the bottom of the spiral stairs below the lantern room, with a head wound."},scene:"The lighthouse stands alone on the rock. The causeway reaches the front door; a small rear jetty on the seaward side is used by boats. The heavy brass telescope that normally sits in the lantern room lay beside the body.",suspects:[{id:"agnes",name:"Agnes Morrow",role:"Relief keeper",portrait:{hue:200,skin:1,hair:"bun",hairColor:3,accessory:"scarf"},bio:"Takes the night watch twice a week. Sharp-tongued, competent, and fond of the Anchor’s whisky.",relationship:"Worked under Edmund for six years.",motive:"Edmund had written to the harbour trust reporting her for drinking on duty; she could lose her post.",alibi:"In the Anchor pub from 20:00 until 23:00, then took the harbour boat out to the rock and found the body.",statements:[{id:"agnes-1",question:"Where were you this evening?",answer:"At the Anchor from eight until eleven. Then I signed out the harbour boat — the causeway was under by then — and went over for my shift. I found him at half past eleven.",claim:{t:"whereabouts",who:"agnes",from:"20:00",to:"23:00",where:"Anchor pub"}},{id:"agnes-2",question:"Had you been drinking?",answer:"Not a drop. I haven’t touched whisky in months, whatever Edmund told the trust.",claim:{t:"topic",topic:"agnes-drinking"}},{id:"agnes-3",question:"Did you see anyone near the rock?",answer:"Only a light on the seaward side as I came across — a boat, maybe, heading out towards the reef. It was too dark to tell whose."}]},{id:"felix",name:"Dr Felix Hart",role:"Village doctor and antiques collector",portrait:{hue:140,skin:0,hair:"swept",hairColor:1,accessory:"glasses"},bio:"Respected GP with an expensive hobby. Sold the museum a ship’s chronometer last spring.",relationship:"Friendly acquaintance — until Edmund had the chronometer appraised.",motive:"The appraisal showed the chronometer was a forgery. Edmund intended to go to the police.",alibi:"Called out to the Penhallow farm inland for a medical emergency for most of the evening.",statements:[{id:"felix-1",question:"When did you last visit the museum?",answer:"Weeks ago. I haven’t set foot in the place since the spring.",claim:{t:"topic",topic:"felix-museum-visit"}},{id:"felix-2",question:"Where were you this evening?",answer:"Old Mrs Penhallow had chest pains. I was at the farm from half nine until eleven; her son can tell you.",claim:{t:"whereabouts",who:"felix",from:"21:30",to:"23:00",where:"Penhallow farm"}},{id:"felix-3",question:"What about the chronometer?",answer:"A misunderstanding. I bought it in good faith."}]},{id:"rosa",name:"Rosa Lindqvist",role:"Museum volunteer, Edmund’s niece",portrait:{hue:330,skin:2,hair:"long",hairColor:4,accessory:"earrings"},bio:"Brings her uncle supper most evenings and helps with the museum’s accounts.",relationship:"Niece and sole heir.",motive:"She inherits the lighthouse cottage and Edmund’s savings.",alibi:"Took him supper, left the rock around 21:45 and walked home across the causeway.",statements:[{id:"rosa-1",question:"Tell me about your visit.",answer:"I brought his supper at nine. He ate it, did his radio report at twenty to ten, and I left about quarter to ten. The tide was coming in, so I didn’t dawdle.",claim:{t:"whereabouts",who:"rosa",from:"21:45",to:"23:30",where:"causeway and home"}},{id:"rosa-2",question:"Was he worried about anything?",answer:"Silas Crane had been pestering him again about the rear jetty. Uncle Edmund said he’d never sell, not while he was alive."},{id:"rosa-3",question:"You inherit everything?",answer:"I suppose so. I would rather have my uncle."}]},{id:"silas",name:"Silas Crane",role:"Fisherman, owner of the boat Kittiwake",portrait:{hue:30,skin:3,hair:"short",hairColor:2,accessory:"beard"},bio:"Edmund’s former business partner in a failed boat-tour venture. Wants the rock’s rear jetty for his new tours.",relationship:"Former partner; the two had not spoken civilly in years.",motive:"Edmund repeatedly refused to sell or lease the rear jetty, which Silas needed to save his business.",alibi:"Out fishing on the Kittiwake off Long Reef, five kilometres away, all evening.",statements:[{id:"silas-1",question:"Where were you this evening?",answer:"Out on the Kittiwake off Long Reef from seven until past midnight. Never went near Gull Rock.",claim:{t:"whereabouts",who:"silas",from:"19:00",to:"23:59",where:"Long Reef"}},{id:"silas-2",question:"The jetty?",answer:"He was a stubborn old fool about it, but I’d not hurt a man over a jetty."},{id:"silas-3",question:"Did you lose any rope recently?",answer:"Rope goes missing all the time on a boat. I wouldn’t know."}]}],evidence:[{id:"radio",title:"Coastguard radio log",kind:"record",location:"Coastguard station",summary:"Edmund’s nightly weather report.",details:"Edmund radioed his weather report at 21:40. The coastguard officer notes he sounded normal and signed off with “Gull Rock, out.”",facts:[]},{id:"coroner",title:"Coroner’s preliminary report",kind:"forensic",location:"County mortuary",summary:"Cause and time of death.",details:"A single blow to the side of the head with a heavy object with an octagonal rim. From body temperature and the supper eaten at about 21:15, death occurred between 21:55 and 22:40.",facts:[{t:"window",from:"21:55",to:"22:40"}]},{id:"telescope",title:"Brass telescope",kind:"physical",location:"Beside the body",summary:"The probable weapon.",details:"The museum’s heavy brass telescope, normally on its stand in the lantern room. Its octagonal rim matches the wound. There is a greasy smear of marine diesel and a few fish scales on the barrel. Anyone on the rock could have picked it up.",facts:[{t:"means",who:"agnes",value:!0,note:"available in the lantern room"},{t:"means",who:"felix",value:!0,note:"available in the lantern room"},{t:"means",who:"rosa",value:!0,note:"available in the lantern room"},{t:"means",who:"silas",value:!0,note:"available in the lantern room"}]},{id:"tide",title:"Tide table and causeway sign",kind:"document",location:"Causeway entrance",summary:"When the causeway can be walked.",details:"On this date the causeway was walkable until 22:10 and flooded from 22:10 until 03:50. The sign warns that walking the causeway from the lighthouse to the village takes at least 20 minutes.",facts:[]},{id:"neighbour",title:"Statement of Mrs Tregear",kind:"testimony",location:"Porthcarrow, Quay Row",summary:"Rosa’s neighbour.",details:"Mrs Tregear saw Rosa arrive home at 22:05 by the church clock, damp from the spray, and heard her moving about until midnight. With a 20-minute walk, Rosa must have left the rock by 21:45; the causeway then flooded and no boat was available to her.",facts:[{t:"elsewhere",who:"rosa",from:"21:45",to:"23:59",where:"causeway and home"}]},{id:"harbourlog",title:"Harbour master’s vessel log",kind:"record",location:"Harbour office",summary:"Every boat that left or entered the harbour.",details:"Kittiwake (S. Crane) out 19:00, back 00:10. Harbour boat signed out by A. Morrow 23:05, back 23:50. No other vessel left the harbour all evening.",facts:[]},{id:"radar",title:"Coastguard radar printout",kind:"record",location:"Coastguard station",summary:"Small-boat contacts near the island.",details:"A single small vessel was stationary at Gull Rock’s rear jetty from 21:50 to 22:30, then headed towards Long Reef. The only vessel out of the harbour at that time was the Kittiwake.",facts:[{t:"seen",who:"silas",from:"21:50",to:"22:30",where:"Gull Rock"}]},{id:"rope",title:"Cut mooring line",kind:"physical",location:"Rear jetty",summary:"A short length of rope left on a cleat.",details:"Blue nylon mooring rope, freshly cut and still tied in a fisherman’s bend. The harbour master says the Kittiwake is rigged with exactly this blue rope.",facts:[{t:"seen",who:"silas",from:"21:50",to:"22:30",where:"Gull Rock"}]},{id:"anchor",title:"Anchor pub receipts and landlord",kind:"testimony",location:"The Anchor",summary:"Agnes’s evening.",details:"The landlord served Agnes from 20:00 until 23:00 and she never left the bar. Her card paid for three double whiskies, the last at 22:58.",facts:[{t:"elsewhere",who:"agnes",from:"20:00",to:"23:00",where:"Anchor pub"},{t:"record",topic:"agnes-drinking"}]},{id:"farm",title:"Penhallow call-out",kind:"testimony",location:"Penhallow farm, 12 km inland",summary:"Dr Hart’s emergency visit.",details:"Mrs Penhallow and her son confirm Dr Hart arrived at 21:30 and left at 23:00. The farm is a forty-minute drive from the coast.",facts:[{t:"elsewhere",who:"felix",from:"21:30",to:"23:00",where:"Penhallow farm"}]},{id:"visitors",title:"Museum visitor book",kind:"document",location:"Museum entrance",summary:"Signatures from the last week.",details:"Dr F. Hart signed in at 16:00 today with the note “inspect chronometer”. Edmund later wrote beside it: “Tried to take it away. Refused.”",facts:[{t:"record",topic:"felix-museum-visit"}]},{id:"letter",title:"Letter to the harbour trust",kind:"document",location:"Edmund’s desk",summary:"An unsent complaint.",details:"A draft letter reporting Agnes Morrow for drinking on duty, dated two days ago.",facts:[]}],timeline:[{id:"t1",time:"16:00",text:"Dr Hart visits the museum and tries to remove the chronometer.",sources:["visitors"],kind:"established"},{id:"t2",time:"19:00",text:"The Kittiwake leaves the harbour.",sources:["harbourlog"],kind:"established"},{id:"t3",time:"21:00",text:"Rosa brings supper to the lighthouse.",sources:["rosa-1"],kind:"claimed"},{id:"t4",time:"21:30",text:"Dr Hart arrives at the Penhallow farm.",sources:["farm"],kind:"established"},{id:"t5",time:"21:40",text:"Edmund radios his weather report — the last time he is known to be alive.",sources:["radio"],kind:"established"},{id:"t6",time:"21:45",text:"Rosa leaves the rock (she must have, to reach home by 22:05).",sources:["rosa-1","neighbour"],kind:"established"},{id:"t7",time:"21:50",text:"A small boat moors at the rear jetty.",sources:["radar"],kind:"established"},{id:"t8",time:"21:55",text:"Earliest time of death.",sources:["coroner"],kind:"established"},{id:"t9",time:"22:05",text:"Rosa arrives home in the village.",sources:["neighbour"],kind:"established"},{id:"t10",time:"22:10",text:"The causeway floods.",sources:["tide"],kind:"established"},{id:"t11",time:"22:30",text:"The boat leaves the rear jetty towards Long Reef.",sources:["radar"],kind:"established"},{id:"t12",time:"22:40",text:"Latest time of death.",sources:["coroner"],kind:"established"},{id:"t13",time:"23:05",text:"Agnes signs out the harbour boat.",sources:["harbourlog"],kind:"established"},{id:"t14",time:"23:30",text:"Agnes finds Edmund’s body.",sources:["agnes-1"],kind:"claimed"}],contradictions:[{id:"c-silas",statementId:"silas-1",evidenceId:"radar",explanation:"Silas swears he never went near Gull Rock, but radar shows a boat at the rear jetty from 21:50 to 22:30 — and the harbour log proves the Kittiwake was the only boat out.",exposes:"silas",redHerring:!1},{id:"c-silas-rope",statementId:"silas-1",evidenceId:"rope",explanation:"A freshly cut length of the Kittiwake’s blue mooring rope was left on the rear jetty cleat — the boat tied up at Gull Rock.",exposes:"silas",redHerring:!1},{id:"c-felix",statementId:"felix-1",evidenceId:"visitors",explanation:"Dr Hart claims he has not visited for weeks, but he signed the visitor book at 16:00 today. He was trying to recover the forged chronometer — embarrassing, but hours before the murder.",exposes:"felix",redHerring:!0},{id:"c-agnes",statementId:"agnes-2",evidenceId:"anchor",explanation:"Agnes says she has not touched whisky in months, but she bought three doubles tonight. She lied about drinking — which also confirms she was in the pub all evening.",exposes:"agnes",redHerring:!0}],methods:[{id:"telescope",text:"Struck on the head with the brass telescope"},{id:"stairs",text:"Pushed down the spiral stairs"},{id:"poison",text:"Poisoned through his supper"},{id:"lamp",text:"Struck with an oil lamp from the museum"}],truth:{culprit:"silas",method:"telescope",motive:"Edmund’s refusal to give up the rear jetty was about to sink Silas’s tour business.",keyEvidence:["radar","rope"],narrative:[{time:"21:40",text:"Edmund finishes his radio report."},{time:"21:45",text:"Rosa leaves to beat the tide."},{time:"21:50",text:"Silas ties the Kittiwake to the rear jetty and climbs to the lantern room to make one last offer."},{time:"22:05",text:"The argument turns violent; Silas strikes Edmund with the telescope and Edmund falls down the stairs."},{time:"22:30",text:"Silas cuts his mooring line in his hurry and motors back towards Long Reef to build his alibi."},{time:"23:30",text:"Agnes arrives by the harbour boat and finds the body."}]},solution:{summary:"Silas Crane killed Edmund with the brass telescope during a visit he denies ever making. Only the Kittiwake was at sea, and a boat sat at the rock’s rear jetty exactly when Edmund died.",decisive:[{evidenceId:"radar",why:"A boat was moored at Gull Rock from 21:50 to 22:30 — inside the coroner’s window."},{evidenceId:"harbourlog",why:"The Kittiwake was the only vessel out of harbour at that time, so the boat at the jetty was Silas’s."},{evidenceId:"rope",why:"The Kittiwake’s distinctive blue rope was cut and left on the jetty."}],eliminations:[{suspectId:"agnes",reason:"The landlord and her card receipts keep her in the Anchor from 20:00 to 23:00, covering the whole window.",evidence:["anchor"]},{suspectId:"felix",reason:"He was at the Penhallow farm, 40 minutes inland, from 21:30 to 23:00.",evidence:["farm"]},{suspectId:"rosa",reason:"She reached home at 22:05 after a walk of at least 20 minutes, so she left the rock by 21:45 — before the earliest time of death — and the flooded causeway kept her off it afterwards.",evidence:["neighbour"]}],redHerrings:[{ref:"visitors",explanation:"Dr Hart’s afternoon visit was an attempt to hide his forgery, not a murder."},{ref:"letter",explanation:"Agnes had a motive, but she was in the pub throughout the window."},{ref:"rosa-1",explanation:"Rosa inherits and was on the rock that evening, but she left before Edmund died."}]}},z$=["prudence","desmond","reggie","polly","theo"].map(a=>({t:"means",who:a,value:!0,note:"every compartment has spare pillows"})),M$={id:"nighttrain",title:"The Northern Star",subtitle:"An overnight sleeper, a locked connecting door and a missing brass button.",setting:"The Northern Star sleeper train, Edinburgh to London, through the small hours",difficulty:3,structure:"Carriages and keys: door sensors, bar receipts and a nightcap that was not a kindness.",crossesMidnight:!0,synopsis:"Industrialist Sir Ambrose Kettering boarded the Northern Star in excellent health and was found dead in his first-class compartment at six in the morning. The train never stopped between his last cup of tea and his death. Somebody on board moved through the sleeping carriages unseen — or thought they did.",victim:{name:"Sir Ambrose Kettering (67)",description:"Railway magnate and newspaper owner, notorious for cutting staff and settling scores.",found:"Found dead in his berth in compartment 7 at 06:00 by the steward bringing morning tea."},scene:"The train runs: guard’s van – carriage B (second class) – carriage C (first-class sleepers) – carriage D (bar and lounge). The door between B and C is locked from midnight to 05:30 and can only be opened with the conductor’s key; a sensor records each opening. C and D are connected all night.",suspects:[{id:"prudence",name:"Lady Prudence Kettering",role:"Sir Ambrose’s wife, compartment 8",portrait:{hue:320,skin:0,hair:"bun",hairColor:4,accessory:"earrings"},bio:"Twenty years younger than her husband and tired of his temper.",relationship:"Wife; sleeping in the neighbouring compartment.",motive:"She inherits most of his fortune, and letters show she planned to leave him.",alibi:"Took her sleeping tablet and slept through the night.",statements:[{id:"prudence-1",question:"How was your marriage?",answer:"Perfectly happy. Ambrose and I were devoted.",claim:{t:"topic",topic:"prudence-affair"}},{id:"prudence-2",question:"What did you do after midnight?",answer:"The conductor kindly brought me a nightcap, I took my usual tablet, and I knew nothing until the steward’s scream."}]},{id:"desmond",name:"Desmond Hale",role:"Rival industrialist, carriage B",portrait:{hue:20,skin:2,hair:"swept",hairColor:1,accessory:"glasses"},bio:"Lost a takeover battle to Kettering last month and lost his temper in the dining car tonight.",relationship:"Business rival.",motive:"Kettering ruined his company in the takeover.",alibi:"In his second-class compartment in carriage B all night.",statements:[{id:"desmond-1",question:"Did you threaten Sir Ambrose?",answer:"Threaten? We had words about business. Nothing more.",claim:{t:"topic",topic:"desmond-threat"}},{id:"desmond-2",question:"Did you leave carriage B?",answer:"The door to first class is locked at midnight. I couldn’t have, even if I’d wanted to."}]},{id:"reggie",name:"Reggie Moss",role:"Train conductor",portrait:{hue:220,skin:3,hair:"short",hairColor:2,accessory:"hat"},bio:"Thirty years on the railways; quiet, punctual, keeps to himself.",relationship:"Kettering’s company owns the line Reggie works on.",motive:"Kettering’s new staff cuts would end his job — and years ago Kettering’s chauffeur-driven car killed Reggie’s brother, with no charges brought.",alibi:"Doing paperwork in the guard’s van from 01:00 until 05:00.",statements:[{id:"reggie-1",question:"Where were you during the night?",answer:"In the guard’s van with the paperwork from one until five. I didn’t set foot in first class.",claim:{t:"whereabouts",who:"reggie",from:"01:00",to:"05:00",where:"guard’s van"}},{id:"reggie-2",question:"Did you take anyone a drink?",answer:"Drinks are Polly’s job. I never serve passengers.",claim:{t:"topic",topic:"reggie-nightcap"}},{id:"reggie-3",question:"Did you know Sir Ambrose?",answer:"Everyone on this line knows who he is."}]},{id:"polly",name:"Polly Grant",role:"Steward",portrait:{hue:120,skin:1,hair:"curly",hairColor:3,accessory:"none"},bio:"Runs the first-class service and the late bar.",relationship:"Sir Ambrose accused her of stealing his cufflinks on a previous trip.",motive:"He was pressing the company to sack her.",alibi:"Serving in the bar car from 00:50 until it closed at 03:30.",statements:[{id:"polly-1",question:"When did you last see Sir Ambrose?",answer:"I took him tea at quarter to one. He complained it was weak — he was perfectly well."},{id:"polly-2",question:"And after that?",answer:"Behind the bar until half three. Mr Marsh can tell you; he hardly left his stool.",claim:{t:"whereabouts",who:"polly",from:"00:50",to:"03:30",where:"bar car"}}]},{id:"theo",name:"Theo Marsh",role:"Investigative journalist, compartment 3",portrait:{hue:70,skin:4,hair:"short",hairColor:0,accessory:"beard"},bio:"Writing an exposé on Kettering’s finances; booked onto the same train deliberately.",relationship:"Kettering’s newspaper had sued him for libel.",motive:"Kettering was trying to bankrupt him with lawsuits.",alibi:"Drinking in the bar car until about 02:45, then went to bed.",statements:[{id:"theo-1",question:"Where were you after midnight?",answer:"Propping up the bar until a quarter to three, then bed.",claim:{t:"whereabouts",who:"theo",from:"00:55",to:"02:45",where:"bar car"}},{id:"theo-2",question:"Why are you on this train?",answer:"I wanted a quote from him for my story. He refused."}]}],evidence:[{id:"teaorder",title:"Steward’s service log",kind:"record",location:"Pantry, carriage C",summary:"The last tea.",details:"Tea delivered to compartment 7 at 00:45. Sir Ambrose signed the chit himself.",facts:[]},{id:"coroner",title:"Pathologist’s findings",kind:"forensic",location:"King’s Cross mortuary",summary:"Cause and time of death.",details:"Asphyxia by smothering: pinpoint haemorrhages in the eyes and pillow fibres in the mouth and nose. Death between 01:15 and 02:30. The tea was tested and is harmless.",facts:[{t:"window",from:"01:15",to:"02:30"}]},{id:"pillow",title:"Spare pillow",kind:"physical",location:"Compartment 7, on the floor",summary:"The probable weapon.",details:"A spare pillow with saliva traces on the case. Every compartment holds spare pillows.",facts:z$},{id:"doorsensor",title:"B–C door sensor log",kind:"record",location:"Carriage control panel",summary:"The locked connecting door.",details:"Locked at 00:00. Opened with the conductor’s key at 02:05 and again at 02:25. Unlocked for the morning at 05:30. No other openings — passengers in carriage B could not reach carriage C during the night.",facts:[{t:"seen",who:"reggie",from:"02:05",to:"02:25",where:"carriage C"},{t:"access",who:"desmond",value:!1,note:"the B–C door was locked and only the conductor’s key opened it"}]},{id:"bartill",title:"Bar till receipts",kind:"record",location:"Carriage D",summary:"Who was in the bar.",details:"Polly rang up sales every few minutes from 00:50 to 03:30. Theo Marsh’s tab shows drinks from 00:55 to 02:40, and two other passengers confirm both stayed in the bar the whole time; Theo left at about 02:45.",facts:[{t:"elsewhere",who:"polly",from:"00:50",to:"03:30",where:"bar car"},{t:"elsewhere",who:"theo",from:"00:55",to:"02:45",where:"bar car"}]},{id:"bloodtest",title:"Lady Prudence’s blood test",kind:"forensic",location:"Hospital laboratory",summary:"Why she slept so soundly.",details:"Three times her normal dose of sleeping medication, taken around 00:30. She would have been unconscious from about 00:45 until after 05:00 — she could not have smothered anyone.",facts:[{t:"elsewhere",who:"prudence",from:"00:45",to:"05:00",where:"unconscious in compartment 8"}]},{id:"nightcap",title:"Bar log: complimentary nightcap",kind:"document",location:"Carriage D",summary:"A drink for compartment 8.",details:"“00:30 — complimentary brandy, compartment 8, collected by the conductor.” Polly says Reggie insisted on taking it himself.",facts:[{t:"record",topic:"reggie-nightcap"}]},{id:"button",title:"Brass uniform button",kind:"physical",location:"Under the berth in compartment 7",summary:"Railway livery.",details:"A brass button stamped with the railway crest. Reggie’s jacket is missing its third button; the torn thread matches.",facts:[{t:"seen",who:"reggie",from:"00:00",to:"05:30",where:"compartment 7"}]},{id:"dining",title:"Dining-car witnesses",kind:"testimony",location:"Dining car (20:00)",summary:"An argument at dinner.",details:"Several diners heard Desmond Hale tell Kettering, “You’ll pay for what you did to my company — one way or another.”",facts:[{t:"record",topic:"desmond-threat"}]},{id:"letters",title:"Letters in Lady Prudence’s case",kind:"document",location:"Compartment 8",summary:"Plans to leave.",details:"Letters to a lover in Paris describing her plan to leave Ambrose after this trip.",facts:[{t:"record",topic:"prudence-affair"}]},{id:"clipping",title:"Newspaper clipping",kind:"document",location:"Guard’s van locker",summary:"An old accident.",details:"Twenty-two years old: a man killed by Kettering’s car; the victim shares Reggie’s surname. Beside it, a staff-cuts memo with Reggie’s name circled.",facts:[]},{id:"cufflinks",title:"Company complaint file",kind:"document",location:"Steward’s pantry",summary:"A grudge against Polly.",details:"Kettering’s formal complaint accusing Polly of stealing cufflinks — and a later note from the company finding no evidence.",facts:[]}],timeline:[{id:"t1",time:"20:00",text:"Desmond threatens Kettering in the dining car.",sources:["dining"],kind:"established"},{id:"t2",time:"00:00",text:"The B–C connecting door is locked for the night.",sources:["doorsensor"],kind:"established"},{id:"t3",time:"00:30",text:"The conductor collects a complimentary brandy for compartment 8.",sources:["nightcap"],kind:"established"},{id:"t4",time:"00:45",text:"Polly delivers tea to Sir Ambrose; Lady Prudence falls deeply asleep.",sources:["teaorder","bloodtest"],kind:"established"},{id:"t5",time:"00:50",text:"Polly opens the late bar; Theo arrives at 00:55.",sources:["bartill"],kind:"established"},{id:"t6",time:"01:00",text:"Reggie says he settles down to paperwork in the guard’s van.",sources:["reggie-1"],kind:"claimed"},{id:"t7",time:"01:15",text:"Earliest time of death.",sources:["coroner"],kind:"established"},{id:"t8",time:"02:05",text:"The B–C door is opened with the conductor’s key.",sources:["doorsensor"],kind:"established"},{id:"t9",time:"02:25",text:"The B–C door is opened with the conductor’s key again.",sources:["doorsensor"],kind:"established"},{id:"t10",time:"02:30",text:"Latest time of death.",sources:["coroner"],kind:"established"},{id:"t11",time:"02:45",text:"Theo leaves the bar for bed.",sources:["bartill"],kind:"established"},{id:"t12",time:"05:30",text:"The connecting door is unlocked for the morning.",sources:["doorsensor"],kind:"established"},{id:"t13",time:"06:00",text:"Polly finds Sir Ambrose dead.",sources:["polly-1"],kind:"claimed"}],contradictions:[{id:"c-reggie-door",statementId:"reggie-1",evidenceId:"doorsensor",explanation:"Reggie says he never left the guard’s van, yet only his key could open the B–C door — and it did, at 02:05 and 02:25, inside the window.",exposes:"reggie",redHerring:!1},{id:"c-reggie-button",statementId:"reggie-1",evidenceId:"button",explanation:"A button torn from Reggie’s jacket lay under the dead man’s berth.",exposes:"reggie",redHerring:!1},{id:"c-reggie-nightcap",statementId:"reggie-2",evidenceId:"nightcap",explanation:"Reggie claims he never serves drinks, but he insisted on carrying the drugged brandy to Lady Prudence himself — making sure she would not wake.",exposes:"reggie",redHerring:!1},{id:"c-desmond",statementId:"desmond-1",evidenceId:"dining",explanation:"Desmond did threaten Kettering at dinner — but the locked door kept him out of carriage C all night.",exposes:"desmond",redHerring:!0},{id:"c-prudence",statementId:"prudence-1",evidenceId:"letters",explanation:"Lady Prudence was planning to leave her husband, but she was drugged unconscious during the window.",exposes:"prudence",redHerring:!0}],methods:[{id:"pillow",text:"Smothered with a pillow"},{id:"tea",text:"Poisoned tea"},{id:"knife",text:"Stabbed with a steak knife from the dining car"},{id:"cord",text:"Strangled with the blind cord"}],truth:{culprit:"reggie",method:"pillow",motive:"Revenge for his brother’s death and for the staff cuts that would end his career.",keyEvidence:["doorsensor","button"],narrative:[{time:"00:30",text:"Reggie takes a heavily drugged brandy to Lady Prudence so she will not hear anything next door."},{time:"00:45",text:"Polly serves Sir Ambrose his tea; Prudence sinks into a drugged sleep."},{time:"02:05",text:"Reggie unlocks the B–C door and slips into compartment 7."},{time:"02:15",text:"He smothers Sir Ambrose with a spare pillow; a button tears from his jacket in the struggle."},{time:"02:25",text:"He returns through the B–C door to the guard’s van."},{time:"06:00",text:"Polly discovers the body."}]},solution:{summary:"Only the conductor’s key could open the locked door into the sleeping car, and it was used twice inside the murder window. Reggie Moss smothered Sir Ambrose — after drugging the one person close enough to hear.",decisive:[{evidenceId:"doorsensor",why:"The conductor’s key opened the B–C door at 02:05 and 02:25, within the window."},{evidenceId:"button",why:"Reggie’s torn button was under the victim’s berth."},{evidenceId:"nightcap",why:"Reggie personally delivered the drugged brandy that knocked out Lady Prudence."}],eliminations:[{suspectId:"prudence",reason:"Her blood test shows she was unconscious from 00:45 until after 05:00.",evidence:["bloodtest"]},{suspectId:"desmond",reason:"The B–C door was locked all night and was opened only with the conductor’s key.",evidence:["doorsensor"]},{suspectId:"polly",reason:"Ringing up sales in the bar car every few minutes from 00:50 to 03:30, with witnesses.",evidence:["bartill"]},{suspectId:"theo",reason:"In the bar from 00:55 until 02:45 — after the latest time of death.",evidence:["bartill"]}],redHerrings:[{ref:"dining",explanation:"Desmond’s threat was real, but he was locked out of the sleeping car."},{ref:"letters",explanation:"Lady Prudence wanted out of her marriage, but she was drugged throughout."},{ref:"cufflinks",explanation:"Polly’s grudge is real, but the bar receipts keep her busy all night."}]}},C$=(a,n)=>Object.entries(a).map(([o,i])=>({t:"means",who:o,value:i,note:n[o]})),O$={id:"observatory",title:"Death Under the Perseids",subtitle:"A meteor shower, a mountain observatory and a thermos of coffee.",setting:"Hollins Peak Observatory, high above the cloud line, during the peak of a meteor shower",difficulty:3,structure:"Means and access: toxicology, key-card logs and a camera that never lies about time.",crossesMidnight:!0,synopsis:"Professor Ines Calloway, the observatory’s director, collapsed at the telescope console in the small hours and could not be revived. The coroner found heart poison in her coffee. Everyone on the mountain had a grudge — and one of them takes heart medication.",victim:{name:"Prof. Ines Calloway (58)",description:"Brilliant, impatient director of the observatory, famous for a discovery others whispered was not entirely hers.",found:"Found slumped over the dome console at 02:10 by a graduate student."},scene:"The main building holds the kitchen, offices and the dome. Every outside door needs a key card and logs each entry and exit. The staff dormitory and the north terrace (used for meteor photography) are outside.",suspects:[{id:"marcus",name:"Dr Marcus Vey",role:"Deputy director",portrait:{hue:210,skin:1,hair:"short",hairColor:0,accessory:"glasses"},bio:"Careful, ambitious, and quietly ill. Has run the observatory’s data pipeline for a decade.",relationship:"Calloway’s deputy for ten years.",motive:"Calloway had discovered he fabricated data in two papers and planned to report it.",alibi:"On a recorded video call with an observatory in Chile from 23:15 until 01:00.",statements:[{id:"marcus-1",question:"Do you take any medication?",answer:"No. I’m perfectly healthy.",claim:{t:"topic",topic:"marcus-medication"}},{id:"marcus-2",question:"Where were you tonight?",answer:"In the dome control room on a video call with Cerro Alto from quarter past eleven until one. It was recorded.",claim:{t:"whereabouts",who:"marcus",from:"23:15",to:"01:00",where:"control room"}},{id:"marcus-3",question:"Did you get on with Ines?",answer:"We disagreed about methods. Scientists do."}]},{id:"lena",name:"Lena Okoro",role:"Graduate student",portrait:{hue:280,skin:4,hair:"curly",hairColor:0,accessory:"none"},bio:"Fourth-year PhD student whose thesis Calloway had just refused to approve.",relationship:"Calloway’s doctoral student.",motive:"Calloway’s refusal would cost her funding and a job offer.",alibi:"Asleep in the dormitory until she came back to check her observations at about two.",statements:[{id:"lena-1",question:"Where were you tonight?",answer:"I left the main building at about twenty to eleven and slept in the dorm. I came back just before two to check my run and found her.",claim:{t:"whereabouts",who:"lena",from:"22:40",to:"01:55",where:"dormitory"}},{id:"lena-2",question:"The thesis?",answer:"She said it wasn’t original. I was furious. I still wouldn’t hurt anyone."}]},{id:"tom",name:"Tom Fairley",role:"Night technician",portrait:{hue:40,skin:2,hair:"bald",hairColor:2,accessory:"beard"},bio:"Has kept the telescopes running for twenty years and resents the new automation.",relationship:"Long-serving employee.",motive:"Calloway had signed off a plan to replace his post with automated systems.",alibi:"On duty at the main control desk all night.",statements:[{id:"tom-1",question:"Did you leave the control desk?",answer:"Not once, all night.",claim:{t:"topic",topic:"tom-left-desk"}},{id:"tom-2",question:"What did you see in the kitchen?",answer:"The professor filled her thermos at half eleven and left it on the counter while she fetched her notes. She took it up to the dome at five past midnight."},{id:"tom-3",question:"Did anyone else come in?",answer:"The building was quiet. I heard the outside door once, around half eleven, but I didn’t look."}]},{id:"simone",name:"Dr Simone Achterberg",role:"Visiting astronomer",portrait:{hue:100,skin:0,hair:"long",hairColor:3,accessory:"scarf"},bio:"Here for a fortnight to photograph the meteor shower. A keen amateur botanist who brews her own herbal teas.",relationship:"Barely knew her — or so she says.",motive:"Old letters show Calloway built her famous discovery on the unpublished work of Simone’s late father.",alibi:"Photographing meteors on the north terrace from 23:00 until 01:00.",statements:[{id:"simone-1",question:"Where were you between eleven and one?",answer:"On the north terrace with my camera the whole time. I never went inside.",claim:{t:"whereabouts",who:"simone",from:"23:00",to:"01:00",where:"north terrace"}},{id:"simone-2",question:"Did you know Professor Calloway before this visit?",answer:"Only by reputation.",claim:{t:"topic",topic:"simone-knew-calloway"}},{id:"simone-3",question:"What is in your tea tin?",answer:"A herbal blend from my garden. It helps me sleep."}]}],evidence:[{id:"tox",title:"Toxicology report",kind:"forensic",location:"Regional laboratory",summary:"What poisoned her.",details:"Death from a cardiac glycoside overdose. The mixture of glycosides is typical of foxglove leaves, not pharmaceutical digoxin tablets. Fragments of dried leaf were found in the thermos.",facts:[]},{id:"kitchen",title:"Technician’s account of the thermos",kind:"testimony",location:"Kitchen",summary:"When the coffee was unattended.",details:"Tom saw Calloway fill her thermos at 23:30 and leave it on the kitchen counter. She took it to the dome at 00:05. Poison could only have been added in between.",facts:[{t:"window",from:"23:30",to:"00:05"}]},{id:"videocall",title:"Recorded video call",kind:"record",location:"Control-room computer",summary:"Dr Vey’s alibi.",details:"A continuous recording of Dr Vey talking to the Cerro Alto team from 23:15 to 01:00 in the control room, which has no route to the kitchen except past the technician’s desk.",facts:[{t:"elsewhere",who:"marcus",from:"23:15",to:"01:00",where:"control room"}]},{id:"pharmacy",title:"Pharmacy record and pill count",kind:"document",location:"Dr Vey’s office",summary:"Dr Vey’s prescription.",details:"Dr Vey is prescribed digoxin tablets. His weekly pill organiser is complete and matches the pharmacy count — and toxicology rules out tablets anyway.",facts:[{t:"means",who:"marcus",value:!1,note:"only had pharmaceutical tablets, all accounted for"},{t:"record",topic:"marcus-medication"}]},{id:"keycards",title:"Key-card log, main building",kind:"record",location:"Security server",summary:"Every entry and exit.",details:"L. Okoro: exit 22:40, entry 01:55. S. Achterberg: entry 23:35, exit 23:55. T. Fairley: no exits all night. No other cards used.",facts:[{t:"elsewhere",who:"lena",from:"22:40",to:"01:55",where:"outside the main building"},{t:"seen",who:"simone",from:"23:35",to:"23:55",where:"main building"}]},{id:"camera",title:"Simone’s camera log",kind:"record",location:"North terrace",summary:"Intervalometer start and stop times.",details:"Her meteor sequence was stopped manually at 23:33 and restarted manually at 23:58 — the only gap all night. Nobody else touched the camera.",facts:[{t:"seen",who:"simone",from:"23:35",to:"23:55",where:"main building"}]},{id:"search",title:"Search of rooms and lockers",kind:"physical",location:"Whole site",summary:"Looking for foxglove.",details:"The only foxglove on the mountain was in Dr Achterberg’s “herbal tea” tin: dried leaves, some crushed. No plant material in the technician’s locker, the dormitory or the offices.",facts:C$({simone:!0,tom:!1,lena:!1},{simone:"had dried foxglove leaves",tom:"no foxglove found",lena:"no foxglove found"})},{id:"vending",title:"Basement vending machine log",kind:"record",location:"Basement",summary:"Purchases overnight.",details:"A snack bought with T. Fairley’s staff card at 00:20 in the basement — the technician did leave his desk briefly, after the thermos had gone to the dome.",facts:[{t:"record",topic:"tom-left-desk"}]},{id:"letters",title:"Letters in Simone’s luggage",kind:"document",location:"Guest room",summary:"Old correspondence.",details:"Letters from Simone’s late father to Calloway, thirty years old, describing the very method Calloway later published as her own.",facts:[{t:"record",topic:"simone-knew-calloway"}]},{id:"thesis",title:"Email to Lena",kind:"document",location:"Calloway’s laptop",summary:"Thesis rejected.",details:"Sent at 18:02: “I cannot approve this thesis in its current form.”",facts:[]}],timeline:[{id:"t1",time:"18:02",text:"Calloway rejects Lena’s thesis by email.",sources:["thesis"],kind:"established"},{id:"t2",time:"22:40",text:"Lena leaves the main building.",sources:["keycards"],kind:"established"},{id:"t3",time:"23:00",text:"Simone says she starts photographing on the terrace.",sources:["simone-1"],kind:"claimed"},{id:"t4",time:"23:15",text:"Dr Vey’s video call begins.",sources:["videocall"],kind:"established"},{id:"t5",time:"23:30",text:"Calloway fills her thermos and leaves it on the kitchen counter.",sources:["kitchen","tom-2"],kind:"established"},{id:"t6",time:"23:33",text:"Simone’s camera sequence is stopped by hand.",sources:["camera"],kind:"established"},{id:"t7",time:"23:35",text:"Simone’s card opens the main building.",sources:["keycards"],kind:"established"},{id:"t8",time:"23:55",text:"Simone’s card leaves the main building.",sources:["keycards"],kind:"established"},{id:"t9",time:"23:58",text:"Simone’s camera sequence is restarted by hand.",sources:["camera"],kind:"established"},{id:"t10",time:"00:05",text:"Calloway carries the thermos to the dome.",sources:["kitchen"],kind:"established"},{id:"t11",time:"00:20",text:"Tom buys a snack in the basement.",sources:["vending"],kind:"established"},{id:"t12",time:"01:00",text:"Dr Vey’s video call ends.",sources:["videocall"],kind:"established"},{id:"t13",time:"01:55",text:"Lena re-enters the main building.",sources:["keycards"],kind:"established"},{id:"t14",time:"02:10",text:"Lena finds Calloway collapsed.",sources:["lena-1"],kind:"claimed"}],contradictions:[{id:"c-simone",statementId:"simone-1",evidenceId:"keycards",explanation:"Simone insists she never went inside, but her key card entered the main building at 23:35 and left at 23:55 — while the thermos stood unattended in the kitchen.",exposes:"simone",redHerring:!1},{id:"c-simone-cam",statementId:"simone-1",evidenceId:"camera",explanation:"Her own camera was stopped by hand at 23:33 and restarted at 23:58, matching the key-card visit exactly.",exposes:"simone",redHerring:!1},{id:"c-simone-letters",statementId:"simone-2",evidenceId:"letters",explanation:"Simone claims to know Calloway only by reputation, yet she carried her father’s letters to Calloway — proof of the stolen discovery and a powerful motive.",exposes:"simone",redHerring:!1},{id:"c-marcus",statementId:"marcus-1",evidenceId:"pharmacy",explanation:"Dr Vey denies taking medication, but he is prescribed digoxin. He hid a heart condition to protect his career — and his tablets are all accounted for.",exposes:"marcus",redHerring:!0},{id:"c-tom",statementId:"tom-1",evidenceId:"vending",explanation:"Tom did leave his desk — for a snack at 00:20, after the thermos was already in the dome.",exposes:"tom",redHerring:!0}],methods:[{id:"foxglove",text:"Foxglove leaves steeped into her thermos coffee"},{id:"digoxin",text:"Crushed digoxin tablets stirred into her coffee"},{id:"co",text:"Carbon monoxide from a faulty heater in the dome"},{id:"blow",text:"A blow to the head in the dark"}],truth:{culprit:"simone",method:"foxglove",motive:"Revenge for the father whose work Calloway stole.",keyEvidence:["keycards","camera","search"],narrative:[{time:"23:30",text:"Calloway leaves her full thermos on the kitchen counter."},{time:"23:33",text:"Simone pauses her camera and slips round to the main entrance."},{time:"23:35",text:"She lets herself in with her key card and crushes foxglove leaves into the thermos."},{time:"23:55",text:"She leaves and restarts her camera at 23:58 to make her alibi look continuous."},{time:"00:05",text:"Calloway carries the poisoned coffee to the dome and drinks it while observing."},{time:"02:10",text:"Lena finds Calloway collapsed at the console."}]},solution:{summary:"Simone Achterberg poisoned the coffee with foxglove from her “herbal tea” tin during the only twenty minutes she was not at her camera — the same twenty minutes her key card was inside.",decisive:[{evidenceId:"tox",why:"The poison came from foxglove leaves, not tablets."},{evidenceId:"search",why:"The only foxglove on the mountain was in Simone’s tea tin."},{evidenceId:"keycards",why:"Her card was inside the building from 23:35 to 23:55, while the thermos was unattended."}],eliminations:[{suspectId:"marcus",reason:"His recorded call covers the whole window, and his tablets are all present — the poison was plant material anyway.",evidence:["videocall","pharmacy"]},{suspectId:"lena",reason:"The key-card log shows her outside the main building from 22:40 until 01:55.",evidence:["keycards"]},{suspectId:"tom",reason:"He was in the building, but no foxglove was found anywhere he could reach.",evidence:["search"]}],redHerrings:[{ref:"pharmacy",explanation:"Dr Vey’s heart medicine made him look guilty, but tablets do not match the toxicology."},{ref:"thesis",explanation:"Lena had a strong motive, but she was locked out of the main building throughout."},{ref:"vending",explanation:"Tom’s snack run happened after the coffee had left the kitchen."}]}},R$=["imogen","gus","della","corin","wendell"].map(a=>({t:"means",who:a,value:!0,note:"releasing the pin on the stage-left rail needs no special skill"})),D$={id:"theatre",title:"Cue Thirty-Four",subtitle:"A dress rehearsal, a falling counterweight and a director who was not in his seat.",setting:"The Gaiety Theatre, during the final dress rehearsal of a new play",difficulty:2,structure:"One exact moment: the rehearsal recording shows where everyone was at 20:47 — almost everyone.",crossesMidnight:!1,synopsis:"At 20:47, during the final dress rehearsal, a 40-kilogram sandbag counterweight plunged from the stage-left fly gallery and killed the leading man, Sebastian Rook. It was no accident: the rope had been unpinned by hand. Everybody in the company had a reason — and the obvious suspect has the best alibi of all.",victim:{name:"Sebastian Rook (44)",description:"Celebrated leading actor, about to walk out of the production and take its investors with him.",found:"Struck at 20:47 on cue 34, in front of the whole company; pronounced dead minutes later."},scene:"The stage-left fly gallery is reached only by a ladder in the stage-left wings. Counterweights are tied off on its rail with steel pins. The rehearsal was filmed from the back of the stalls and from a camera covering the auditorium seats.",suspects:[{id:"imogen",name:"Imogen Vale",role:"Understudy",portrait:{hue:340,skin:1,hair:"long",hairColor:3,accessory:"none"},bio:"Talented, overlooked, and Sebastian’s understudy for two years.",relationship:"Understudy; would inherit the lead role.",motive:"With Sebastian gone she becomes the star.",alibi:"On stage in the market-scene crowd at the moment of the accident.",statements:[{id:"imogen-1",question:"Where were you at 20:47?",answer:"On stage in the crowd — I was the flower-seller, centre right. I saw it fall.",claim:{t:"whereabouts",who:"imogen",from:"20:45",to:"20:50",where:"on stage"}},{id:"imogen-2",question:"Have you ever been up on the fly gallery?",answer:"Never. I don’t touch the rigging.",claim:{t:"topic",topic:"imogen-ladder"}}]},{id:"gus",name:"Gus Ferreira",role:"Fly operator",portrait:{hue:30,skin:3,hair:"short",hairColor:1,accessory:"beard"},bio:"Runs the flying system; responsible for the counterweights.",relationship:"Sebastian had publicly blamed him for a near-miss last week.",motive:"Sebastian was demanding he be fired.",alibi:"On the stage-right rail flying in the backdrop on cue 34.",statements:[{id:"gus-1",question:"Where were you at 20:47?",answer:"On the stage-right rail, flying in the street backdrop on cue 34. Twelve metres from that sandbag, across open air.",claim:{t:"whereabouts",who:"gus",from:"20:40",to:"20:55",where:"stage-right rail"}},{id:"gus-2",question:"Who could reach the stage-left gallery?",answer:"Anyone backstage can climb the stage-left ladder. It isn’t locked."}]},{id:"della",name:"Della Price",role:"Stage manager",portrait:{hue:200,skin:2,hair:"bun",hairColor:0,accessory:"glasses"},bio:"Calls every cue from the prompt desk; the calm centre of every production.",relationship:"Sebastian had tried to have her replaced by his own stage manager.",motive:"Her job was under threat.",alibi:"At the prompt desk calling cues.",statements:[{id:"della-1",question:"Where were you at 20:47?",answer:"At the prompt desk, calling cue 34. My headset is wired
